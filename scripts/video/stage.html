<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Wiener Lens · video sahnesi</title>
<!--
  A 1080×1350 stage for the launch video. The demo's screens sit in iframes; render(t) places the
  camera, the captions and the end card for time t in seconds, so frames can be captured one by
  one at any rate. Nothing here animates by itself.

  To render:
    1. DEMO_NOW=2026-10-21T16:20:00+03:00 npm run build:demo
    2. Copy this file to dist/demo-site/video/, and the Bricolage and IBM Plex woff2 files it
       names to dist/demo-site/video/fonts/; serve dist/demo-site (npx vite preview).
    3. In a headless browser at 1080×1350, with Date shifted to the same moment and
       localStorage "wiener-theme" set to "dark" before any page loads, open
       /video/stage.html?oturum=<session id>&proje=<project key>, wait for window.stageReady,
       then for each frame i
       call render(i / 30) and take a screenshot, up to window.DURATION seconds. The launch video
       used the "Çift işlenen iadeler" session and /Users/demo/code/carsi-web.
    4. ffmpeg -framerate 30 -i f%04d.jpg -vf "scale=in_range=pc:out_range=tv,format=yuv420p"
       -c:v libx264 -crf 17 -preset slow -movflags +faststart wiener-tools-lens.mp4
-->
<style>
  @font-face { font-family: 'Bricolage'; src: url(fonts/bricolage-grotesque-latin-wght-normal.woff2) format('woff2'); font-weight: 200 800; unicode-range: U+0000-00FF, U+0131, U+2000-206F; }
  @font-face { font-family: 'Bricolage'; src: url(fonts/bricolage-grotesque-latin-ext-wght-normal.woff2) format('woff2'); font-weight: 200 800; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1EFF; }
  @font-face { font-family: 'Plex'; src: url(fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+2000-206F; }
  @font-face { font-family: 'Plex'; src: url(fonts/ibm-plex-sans-latin-ext-400-normal.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1EFF; }
  @font-face { font-family: 'PlexMono'; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #111316; color: #eceef2; -webkit-font-smoothing: antialiased; }
  .caption { position: absolute; left: 84px; right: 84px; font-family: 'Bricolage'; font-weight: 600; letter-spacing: -1.6px; }
  .caption em { font-style: normal; color: #6da7ec; }
  #hook { top: 0; bottom: 0; display: flex; align-items: center; font-size: 82px; line-height: 1.04; letter-spacing: -2.6px; }
  #top { top: 104px; font-size: 62px; line-height: 1.08; }
  #window { position: absolute; left: 80px; top: 360px; width: 920px; height: 860px; border-radius: 28px; overflow: hidden; border: 1px solid #262a31; background: #111316; box-shadow: 0 40px 90px rgba(0, 0, 0, 0.5); }
  #window iframe { position: absolute; left: 0; top: 0; width: 1440px; height: 2400px; border: 0; transform-origin: 0 0; }
  #brand { position: absolute; left: 84px; bottom: 58px; display: flex; align-items: center; gap: 12px; font-family: 'Bricolage'; font-weight: 600; font-size: 24px; color: #a7adb8; }
  #brand svg, #end svg { width: auto; }
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #end h2 { margin-top: 36px; font-family: 'Bricolage'; font-weight: 600; font-size: 64px; line-height: 1.06; letter-spacing: -2px; }
  #end .cmd { margin-top: 56px; font-family: 'PlexMono'; font-size: 34px; padding: 20px 30px; border: 1px solid #2c313a; border-radius: 18px; background: #181b20; }
  #end .url { margin-top: 26px; font-family: 'Plex'; font-size: 30px; color: #a7adb8; }
  #end .note { position: absolute; bottom: 72px; font-family: 'Plex'; font-size: 26px; color: #757b86; }
</style>
</head>
<body>
  <div id="hook" class="caption"><div>Claude Code ile<br />ne kadar çalıştığını<br /><em>biliyor musun?</em></div></div>
  <div id="top" class="caption"></div>
  <div id="window">
    <!-- Each screen at the width where its subject reads best once the camera closes in. -->
    <iframe id="overview" src="/" title="Genel bakış" style="width: 1360px"></iframe>
    <iframe id="project" title="Proje" style="width: 1024px; height: 4600px"></iframe>
    <iframe id="tips" src="/ipuclari" title="İpuçları" style="width: 920px"></iframe>
    <iframe id="session" title="Oturum" style="width: 900px"></iframe>
    <iframe id="year" src="/yil-ozeti" title="Yıl özeti" style="width: 1200px"></iframe>
  </div>
  <div id="brand">
    <svg viewBox="0 0 607 424" height="22" fill="#a7adb8" aria-hidden="true"><path fill-rule="evenodd" d="M2 0 122 1 122 279 127 291 134 298 148 303 221 302 233 296 233 294 238 290 242 281 243 1 363 1 365 281 370 292 372 292 377 298 386 302 485 304 485 424 364 424 253 312 248 316 243 328 242 424 121 424 117 421 11 315 4 304 1 295 0 2Z M487 0 605 0 607 2 607 177 601 189 545 243 488 243 486 241 486 183 533 182 541 178 546 169 546 122 487 122 485 119Z"/></svg>
    Wiener Lens
  </div>
  <div id="end">
    <svg viewBox="0 0 607 424" height="76" fill="#eceef2" aria-hidden="true"><path fill-rule="evenodd" d="M2 0 122 1 122 279 127 291 134 298 148 303 221 302 233 296 233 294 238 290 242 281 243 1 363 1 365 281 370 292 372 292 377 298 386 302 485 304 485 424 364 424 253 312 248 316 243 328 242 424 121 424 117 421 11 315 4 304 1 295 0 2Z M487 0 605 0 607 2 607 177 601 189 545 243 488 243 486 241 486 183 533 182 541 178 546 169 546 122 487 122 485 119Z"/></svg>
    <h2>Wiener Lens</h2>
    <div class="cmd">npx wiener-tools-lens</div>
    <div class="url">lens.wienerlabs.xyz</div>
    <div class="note">Yerel çalışır. Veri göndermez.</div>
  </div>

<script>
  const params = new URLSearchParams(location.search)
  document.getElementById('session').src = `/oturumlar/${params.get('oturum')}`
  document.getElementById('project').src = `/projeler/${encodeURIComponent(params.get('proje') ?? '')}`
  const W = 920
  const H = 860

  // Scenes, in seconds: from the whole year down to one session, then advice, then the year's
  // card. Captions sit above the window; the hook and the end card fill the frame.
  const SCENES = [
    { id: 'overview', from: 3.0, to: 8.4, caption: 'Bir yıllık çalışman, <em>gün gün.</em>' },
    { id: 'project', from: 8.4, to: 14.6, caption: 'Her projen, <em>ayrı ayrı.</em>' },
    { id: 'session', from: 14.6, to: 20.4, caption: 'Her oturum, <em>adım adım.</em>' },
    { id: 'tips', from: 20.4, to: 26.2, caption: 'Paranın nereye gittiğini<br>ve <em>ne yapacağını</em> söyler.' },
    { id: 'year', from: 26.2, to: 30.6, caption: 'Yılın, <em>tek kartta.</em>' },
  ]
  const END = 30.6
  const DURATION = 34.3

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
  const ramp = (t, a, b) => clamp((t - a) / (b - a))
  const ease = (x) => 0.5 - Math.cos(Math.PI * x) / 2
  const mix = (a, b, k) => a + (b - a) * k

  /** Camera paths, measured once the screens have loaded: [start, end] regions in page pixels. */
  const paths = {}
  const rectOf = (frame, el) => {
    const r = el.getBoundingClientRect()
    return { x: r.left + frame.contentWindow.scrollX, y: r.top + frame.contentWindow.scrollY, w: r.width, h: r.height }
  }
  const around = (r, pad, w = r.w + pad * 2) => ({ x: r.x + r.w / 2 - w / 2, y: r.y - pad, w })

  /** Height of a region `w` page pixels wide, at the window's proportions. */
  const tall = (w) => (H * w) / W

  function measure() {
    const f = (id) => document.getElementById(id)
    const doc = (id) => f(id).contentDocument
    // Overview: the heading over the year's calendar, then in on the busy recent months.
    const h = rectOf(f('overview'), doc('overview').querySelector('main h1'))
    const c = rectOf(f('overview'), doc('overview').querySelector('main section'))
    const close = c.w * 0.56
    paths.overview = [
      { x: c.x - 28, y: h.y - 44, w: c.w + 56 },
      { x: c.x + c.w - close + 16, y: c.y + c.h / 2 - tall(close) / 2, w: close },
    ]
    // Project: its name and numbers, then down to what it cost day by day and in which languages.
    const pd = doc('project')
    const ph = rectOf(f('project'), pd.querySelector('main h1'))
    const pm = rectOf(f('project'), pd.querySelector('main'))
    // Down the page at reading pace, from the name and numbers through the calendar, the cost
    // chart and languages, the files and tools, as far as the scene's time allows.
    const pageW = pm.w - 16
    // The page is as tall as the frame it sits in; stop where its content ends, not at the frame's foot.
    const content = rectOf(f('project'), pd.querySelector('main').lastElementChild)
    const bottom = content.y + content.h + 32 - tall(pageW)
    paths.project = [
      { x: pm.x + 8, y: ph.y - 40, w: pageW },
      0.1,
      { x: pm.x + 8, y: Math.min(bottom, ph.y - 40 + 2300), w: pageW },
    ]
    // Tips: the first card whole, then a step in on what it found and what it is worth.
    const card = rectOf(f('tips'), doc('tips').querySelector('main section[id]'))
    paths.tips = [around(card, 22), { x: card.x + 18, y: card.y + 8, w: card.w - 36 }]
    // Session: down the transcript, from the title and the question to Claude's summary.
    // The session list is hidden at this width, its heading too; take the one on screen.
    const d = doc('session')
    const titleEl = [...d.querySelectorAll('main h1')].find((el) => el.getClientRects().length > 0)
    const title = rectOf(f('session'), titleEl)
    const main = rectOf(f('session'), d.querySelector('main'))
    const summary = [...d.querySelectorAll('main p, main div')].find((el) => el.childElementCount === 0 && el.textContent.startsWith('Sebep: iki istek'))
    const sum = rectOf(f('session'), summary ?? titleEl)
    // The failing test: from there to the summary is the part worth watching.
    const failing = [...d.querySelectorAll('main button')].find((el) => el.textContent.includes('go test') && el.textContent.includes('hata'))
    const fail = rectOf(f('session'), failing ?? titleEl)
    const wide = main.w - 40
    const fromFail = fail.y - 70
    const toSummary = sum.y + sum.h + 50 - tall(wide)
    // Rest on the title and the question, then glide down to the failing test and the fix.
    paths.session = [
      { x: main.x + 20, y: title.y - 40, w: wide },
      0.3,
      // Start at the failing test if the summary still fits below; otherwise keep the summary in.
      { x: main.x + 20, y: Math.max(fromFail, toSummary), w: wide },
    ]
    // Year: the card, a slow step closer.
    const yr = rectOf(f('year'), doc('year').querySelector('svg[aria-label$="yıl özeti kartı"]'))
    const centered = (pad) => {
      const w = yr.w + pad * 2
      return { x: yr.x - pad, y: yr.y + yr.h / 2 - tall(w) / 2, w }
    }
    paths.year = [centered(30), centered(4)]
  }

  /** A path is two regions, or [region, hold until, region] to rest on the first a while. */
  function camera(id, p) {
    const path = paths[id]
    const [a, b, k] = path.length === 3 ? [path[0], path[2], ease(ramp(p, path[1], 1))] : [path[0], path[1], ease(p)]
    const r = { x: mix(a.x, b.x, k), y: mix(a.y, b.y, k), w: mix(a.w, b.w, k) }
    const s = W / r.w
    return `translate(${-r.x * s}px, ${-r.y * s}px) scale(${s})`
  }

  window.render = (t) => {
    const hook = document.getElementById('hook')
    const top = document.getElementById('top')
    const win = document.getElementById('window')
    const brand = document.getElementById('brand')
    const end = document.getElementById('end')

    // Hook: in, hold, out as the window rises.
    const hookIn = ease(ramp(t, 0.15, 0.75))
    const hookOut = ease(ramp(t, 2.45, 2.95))
    hook.style.opacity = String(hookIn * (1 - hookOut))
    hook.style.transform = `translateY(${(1 - hookIn) * 18 - hookOut * 30}px)`

    // Window: rises at the start, fades at the end.
    const winIn = ease(ramp(t, 2.6, 3.3))
    const winOut = ease(ramp(t, END - 0.35, END + 0.25))
    win.style.opacity = String(winIn * (1 - winOut))
    win.style.transform = `translateY(${(1 - winIn) * 70}px) scale(${1 - winOut * 0.03})`
    brand.style.opacity = String(winIn * (1 - winOut))

    // Screens: crossfade between scenes, each with its own slow camera move.
    for (const s of SCENES) {
      const el = document.getElementById(s.id)
      const fadeIn = s.from <= 3.0 ? 1 : ease(ramp(t, s.from - 0.25, s.from + 0.25))
      const fadeOut = s.to >= END ? 0 : ease(ramp(t, s.to - 0.25, s.to + 0.25))
      el.style.opacity = String(fadeIn * (1 - fadeOut))
      el.style.transform = camera(s.id, ramp(t, s.from + 0.35, s.to - 0.15))
    }

    // Caption of the current scene.
    const scene = SCENES.find((s) => t >= s.from - 0.1 && t < s.to + 0.1)
    if (scene) {
      if (top.dataset.id !== scene.id) {
        top.innerHTML = scene.caption
        top.dataset.id = scene.id
      }
      const k = ease(ramp(t, scene.from + 0.05, scene.from + 0.5)) * (1 - ease(ramp(t, scene.to - 0.4, scene.to - 0.05)))
      top.style.opacity = String(k)
      top.style.transform = `translateY(${(1 - k) * 14}px)`
    } else {
      top.style.opacity = '0'
    }

    // End card.
    const endIn = ease(ramp(t, END + 0.15, END + 0.85))
    end.style.opacity = String(endIn)
    end.style.transform = `translateY(${(1 - endIn) * 22}px)`
  }

  // Ready once every screen has its data on the page.
  const ready = {
    overview: (d) => /mesaj/.test(d.querySelector('main h1')?.textContent ?? ''),
    project: (d) => [...d.querySelectorAll('main h2')].some((el) => el.textContent.trim() === 'Diller'),
    tips: (d) => !!d.querySelector('main section[id]'),
    session: (d) => (d.querySelector('main')?.textContent ?? '').includes('Sebep: iki istek'),
    year: (d) => !!d.querySelector('svg[aria-label$="yıl özeti kartı"]'),
  }
  const css = 'main > div:first-child:has(button[aria-label*="kopyala"]) { display: none !important } html { scrollbar-width: none } ::-webkit-scrollbar { display: none }'
  window.stageReady = false
  const poll = setInterval(() => {
    const all = Object.entries(ready).every(([id, ok]) => {
      const d = document.getElementById(id).contentDocument
      return d && d.readyState === 'complete' && ok(d)
    })
    if (!all) return
    clearInterval(poll)
    // The year screen shows only its card: no header, controls or detail tables.
    const only = { year: 'main header { display: none !important } main .space-y-6 > .space-y-6 > :not(.overflow-hidden) { display: none !important }' }
    for (const id of Object.keys(ready)) {
      const d = document.getElementById(id).contentDocument
      const style = d.createElement('style')
      style.textContent = css + (only[id] ?? '')
      d.head.appendChild(style)
    }
    setTimeout(() => {
      measure()
      render(0)
      window.stageReady = true
    }, 600)
  }, 200)
  window.DURATION = DURATION
</script>
</body>
</html>
